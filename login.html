<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Log In | Chrysalias.com</title>
  <link href="build/css/styles.c1f694f88b96b5fa6f2c.css" rel="stylesheet">
  <link href="css/app-custom.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="build/images/favicons/favicon-32x32.png">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
      background-color: var(--escrow-bg-webapp);
    }
  </style>
</head>
<body style="background-color: var(--escrow-bg-webapp);">

  <div class="custom-page-wrapper">
    <div class="auth-container">
      <div class="auth-header">
        <a href="index.html" style="text-decoration: none; display: inline-block; margin-bottom: 12px;">
          <span style="font-family: 'Inter', sans-serif !important; font-weight:800; font-size:1.35rem; color:#002b49; letter-spacing: -0.5px;">CHRYSALIAS<span style="color:#3cb95d">.COM</span></span>
        </a>
        <h2 style="font-size: 1.35rem; font-weight: 800; color: #002b49; margin: 0 0 4px 0;">Sign In to Chrysalias.com</h2>
        <p style="font-size: 0.84rem; color: #64748b; margin: 0;">Access your transactions, balances, and safe payment portal</p>
      </div>

      <!-- Quick Demo Login Helpers -->
      <div class="demo-auth-box">
        <p style="font-size: 0.82rem; font-weight: 700; color: #166534; margin-bottom: 6px;">⚡ Fast Demo Login Options:</p>
        <div class="demo-btn-group">
          <button type="button" class="demo-btn" id="demoBuyerBtn">Demo Buyer (Sarah)</button>
          <button type="button" class="demo-btn" id="demoSellerBtn">Demo Seller (Alex)</button>
        </div>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="emailInput" style="font-size: 0.84rem; font-weight: 600; color: #1e293b;">Email Address</label>
          <input type="email" id="emailInput" class="form-control" placeholder="name@company.com" required value="alex.seller@chrysalias-demo.com">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <label for="passwordInput" style="margin:0; font-size: 0.84rem; font-weight: 600; color: #1e293b;">Password</label>
            <a href="#" id="forgotPassLink" style="font-size: 0.78rem; color: var(--escrow-navy); text-decoration: none; font-weight: 600;">Forgot Password?</a>
          </div>
          <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required value="Password123!">
        </div>

        <button type="submit" class="btn-escrow-green" style="width: 100%; justify-content: center; font-size: 0.9rem; padding: 10px; font-weight: 700; border-radius: 6px; box-shadow: 0 4px 12px rgba(60,185,93,0.25);">
          Sign In
        </button>

        <div class="auth-switch-link" style="font-size: 0.84rem; margin-top: 16px; text-align: center; color: #64748b;">
          Don't have an account? <a href="signup.html" style="color: #002b49; font-weight: 700; text-decoration: none;">Sign Up</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app-custom.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('emailInput');
      const passwordInput = document.getElementById('passwordInput');

      document.getElementById('demoBuyerBtn').addEventListener('click', function () {
        emailInput.value = 'sarah.buyer@investments.co';
        passwordInput.value = 'Password123!';
      });

      document.getElementById('demoSellerBtn').addEventListener('click', function () {
        emailInput.value = 'alex.seller@chrysalias-demo.com';
        passwordInput.value = 'Password123!';
      });

      document.getElementById('forgotPassLink').addEventListener('click', function (e) {
        e.preventDefault();
        window.EscrowApp.showToast('Password reset link sent to registered email.');
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const email = emailInput.value.trim();
        const name = email.split('@')[0].replace('.', ' ').replace(/\b\w/g, l => l.toUpperCase());

        window.EscrowApp.setUser({ name: name || 'Alex Mercer', email: email });
        window.EscrowApp.showToast('Logged in successfully! Redirecting...');

        setTimeout(function () {
          window.location.href = 'dashboard.html';
        }, 800);
      });
    });
  </script>
</body>
</html>
