services:
  - type: web
    name: chrysalias-backend
    runtime: python
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "gunicorn chrysalias.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      # --- Layerbase PostgreSQL ---
      - key: DATABASE_URL
        value: postgresql://postgres:ZI3GQ8C1IspueEpW71A6WEPy@chrysalias-true-crypt.cloud.layerbase.dev/chrysalias?sslmode=require

      # --- Django Security ---
      - key: SECRET_KEY
        value: chrysalias-prod-secret-key-2026-very-secure-xyz-v2
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "chrysalias-backend.onrender.com,chrysalias.com,www.chrysalias.com,*"
      - key: FRONTEND_BASE_URL
        value: "https://chrysalias.com"

      # --- CORS ---
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

      # --- ZeptoMail SMTP ---
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.zeptomail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: EMAIL_HOST_USER
        value: emailapikey
      - key: EMAIL_HOST_PASSWORD
        value: "wSsVR61y/RWkW/p4yTOpdrhuyAtQB16kEkwp3lP36n+tH6iU8Mc6xRfJDFD0H/gWQDI8EDQbpe8hm0sC0WULhth7mA4ACCiF9mqRe1U4J3x17qnvhDzIX2VfkBSJLoIJzg1imGNnEcsr+g=="
      - key: DEFAULT_FROM_EMAIL
        value: "Chrysalias Support <info@chrysalias.com>"

      # --- Django Admin Superuser (auto-created on first deploy) ---
      - key: DJANGO_SUPERUSER_EMAIL
        value: "info@chrysalias.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        value: "Chrys@768"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin_chrysalias"

    healthCheckPath: /
