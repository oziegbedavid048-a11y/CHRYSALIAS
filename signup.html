<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Create Your Chrysalias.com Account | Chrysalias.com</title>
  <link href="build/css/styles.c1f694f88b96b5fa6f2c.css" rel="stylesheet">
  <link href="css/app-custom.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="build/images/favicons/favicon-32x32.png">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
      background-color: var(--escrow-bg-webapp);
    }
    .signup-name-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 480px) {
      .signup-name-grid {
        grid-template-columns: 1fr !important;
        gap: 0 !important;
      }
    }
  </style>
</head>
<body style="background-color: var(--escrow-bg-webapp);">

  <div class="custom-page-wrapper">
    <div class="auth-container">
      <div class="auth-header">
        <a href="index.html" style="text-decoration: none; display: inline-block; margin-bottom: 12px;">
          <span style="font-family: 'Inter', sans-serif !important; font-weight:800; font-size:1.35rem; color:#002b49; letter-spacing: -0.5px;">CHRYSALIAS<span style="color:#3cb95d">.COM</span></span>
        </a>
        <h2 style="font-size: 1.35rem; font-weight: 800; color: #002b49; margin: 0 0 4px 0;">Create a Chrysalias Account</h2>
        <p style="font-size: 0.84rem; color: #64748b; margin: 0;">Join over 3M+ users trading securely worldwide</p>
      </div>

      <form id="signupForm">
        <div class="signup-name-grid">
          <div class="form-group">
            <label for="firstName" style="font-size: 0.84rem;">First Name</label>
            <input type="text" id="firstName" class="form-control" placeholder="David" required>
          </div>
          <div class="form-group">
            <label for="lastName" style="font-size: 0.84rem;">Last Name</label>
            <input type="text" id="lastName" class="form-control" placeholder="Buyer" required>
          </div>
        </div>

        <div class="form-group">
          <label for="emailInput" style="font-size: 0.84rem;">Email Address</label>
          <input type="email" id="emailInput" class="form-control" placeholder="name@company.com" required>
        </div>

        <div class="form-group">
          <label for="passwordInput" style="font-size: 0.84rem;">Password</label>
          <input type="password" id="passwordInput" class="form-control" placeholder="At least 8 characters" required>
        </div>

        <div class="form-group" style="display: flex; align-items: flex-start; gap: 8px; margin-top: 4px;">
          <input type="checkbox" id="termsCheck" required style="margin-top: 3px; width: 15px; height: 15px; flex-shrink: 0;">
          <label for="termsCheck" style="font-size: 0.8rem; color: #64748b; font-weight: normal; margin: 0; line-height: 1.3;">
            I agree to the <a href="#" style="color: var(--escrow-navy); font-weight: 700;">General Chrysalias Instructions</a> and <a href="#" style="color: var(--escrow-navy); font-weight: 700;">Privacy Policy</a>.
          </label>
        </div>

        <button type="submit" class="btn-escrow-green" style="width: 100%; justify-content: center; font-size: 0.9rem; padding: 10px; font-weight: 700; border-radius: 6px; box-shadow: 0 4px 12px rgba(60,185,93,0.25); margin-top: 4px;">
          Create Account & Sign In
        </button>

        <div class="auth-switch-link" style="font-size: 0.84rem; margin-top: 16px; text-align: center; color: #64748b;">
          Already have an account? <a href="login.html" style="color: #002b49; font-weight: 700; text-decoration: none;">Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app-custom.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('signupForm');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('emailInput').value.trim();

        const fullName = `${firstName} ${lastName}`.trim() || 'New User';

        window.EscrowApp.setUser({ name: fullName, email: email });
        window.EscrowApp.showToast('Account created successfully! Welcome aboard.');

        setTimeout(function () {
          window.location.href = 'dashboard.html';
        }, 800);
      });
    });
  </script>
</body>
</html>
